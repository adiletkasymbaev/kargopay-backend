  /api/v1/user/google/:
    post:
      operationId: user_google_create
      description: |-
        Вход или регистрация через Google с использованием Firebase Authentication.

        **Процесс входа:**
        1. Клиент получает Firebase ID токен через Firebase SDK (Google Sign-In)
        2. Токен отправляется на этот endpoint
        3. Сервер верифицирует токен через Google
        4. Если пользователь существует — входит в систему
        5. Если пользователя нет — создаёт новый аккаунт и входит

        **Тело запроса:**
        - `firebase_token` (string) — Firebase ID токен, полученный после успешного Google Sign-In

        **Возвращаемые данные:**
        - `access` — JWT access токен
        - `refresh` — JWT refresh токен
        - `user` — данные пользователя:
          - `id` — ID пользователя
          - `email` — email из Google аккаунта
          - `first_name` — имя из Google аккаунта
          - `last_name` — фамилия из Google аккаунта
          - `is_new_user` — true если аккаунт был создан только что

        **Пример получения токена на клиенте (Firebase SDK v9+):**
        ```javascript
        import { GoogleAuthProvider, signInWithPopup, getAuth } from 'firebase/auth';

        const provider = new GoogleAuthProvider();
        const auth = getAuth();
        const result = await signInWithPopup(auth, provider);
        const firebaseToken = await result.user.getIdToken();

        // Отправляем firebaseToken на сервер
        fetch('/api/v1/auth/google/', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({firebase_token: firebaseToken})
        });
        ```
      summary: Вход через Google
      tags:
      - Auth
      requestBody:
        content:
          type:
            schema:
              type: object
              additionalProperties: {}
              description: Unspecified request body
          properties:
            schema:
              firebase_token:
                type: string
      security:
      - jwtAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Успешный вход через Google
                content:
                  application/json:
                    example:
                      access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxfQ...
                      refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxfQ...
                      user:
                        id: 1
                        email: user@gmail.com
                        first_name: John
                        last_name: Doe
                        is_new_user: false
              examples:
                УспешныйВход(существующийПользователь):
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user:
                      id: 1
                      email: user@gmail.com
                      first_name: John
                      last_name: Doe
                      is_new_user: false
                  summary: Успешный вход (существующий пользователь)
                УспешнаяРегистрация(новыйПользователь):
                  value:
                    access: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    refresh: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    user:
                      id: 2
                      email: newuser@gmail.com
                      first_name: Jane
                      last_name: Smith
                      is_new_user: true
                  summary: Успешная регистрация (новый пользователь)
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Неверный токен
              examples:
                ОшибкаВерификацииТокена:
                  value:
                    error: Неверный Firebase токен
                  summary: Ошибка верификации токена
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Токен не прошёл верификацию
          description: ''
