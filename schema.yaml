  /api/v1/push-token/register/:
    post:
      operationId: push_token_register_create
      description: |-
        Регистрирует или обновляет push-токен устройства для получения уведомлений.

        Токен сохраняется в базе данных и связывается с текущим пользователем.
        При повторной отправке того же токена данные обновляются.

        **Тело запроса:**
        - `token` (string) — уникальный токен устройства (FCM/APNS)
        - `device_type` (string) — тип устройства: 'ios', 'android' или 'web'
        - `device_info` (string, опционально) — название устройства или браузера (например, 'iPhone 15 Pro', 'Chrome 120')

        **Возвращаемые данные:**
        - `id` — идентификатор записи
        - `token` — токен устройства
        - `device_type` — тип устройства
        - `device_info` — информация об устройстве
        - `user` — ID пользователя
        - `created_at` — дата регистрации
      summary: Зарегистрировать Push-токен
      tags:
      - Notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRegisterRequest'
            examples:
              Запрос(Android):
                value:
                  token: fcm_device_token_12345
                  device_type: android
                  device_info: Samsung Galaxy S24
                summary: Запрос (Android)
              Запрос(iOS):
                value:
                  token: apns_device_token_67890
                  device_type: ios
                  device_info: iPhone 15 Pro
                summary: Запрос (iOS)
              Запрос(Web):
                value:
                  token: fcm_web_token_abcde
                  device_type: web
                  device_info: Chrome 120 on Windows 11
                summary: Запрос (Web)
              УспешныйОтвет:
                value:
                  id: 1
                  token: fcm_device_token_12345
                  device_type: android
                  device_info: Samsung Galaxy S24
                  user: 42
                  created_at: '2026-03-14T10:30:00Z'
                summary: Успешный ответ
              ОшибкаВалидации:
                value:
                  token:
                  - Это поле обязательно.
                  device_type:
                  - 'Выберите допустимое значение: ios, android, web'
                summary: Ошибка валидации
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PushTokenRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PushTokenRegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushToken'
              examples:
                УспешныйОтвет:
                  value:
                    id: 1
                    token: fcm_device_token_12345
                    device_type: android
                    device_info: Samsung Galaxy S24
                    user: 42
                    created_at: '2026-03-14T10:30:00Z'
                  summary: Успешный ответ
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Ошибка валидации данных
              examples:
                ОшибкаВалидации:
                  value:
                    token:
                    - Это поле обязательно.
                    device_type:
                    - 'Выберите допустимое значение: ios, android, web'
                  summary: Ошибка валидации
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Пользователь не авторизован
          description: ''
