  /api/v1/orders/orders/history/:
    get:
      operationId: orders_orders_history_list
      description: |-
        Получить все заявки текущего пользователя с группировкой по датам.

        Заявки возвращаются в хронологическом порядке (новые первыми) и группируются по датам:
        - **Сегодня** — заявки за текущий день
        - **Вчера** — заявки за вчерашний день
        - **N дн. назад** — заявки за последние 7 дней
        - **ДД.ММ.ГГГГ** — более старые заявки

        **Параметры запроса:**
        - `page` (integer) — номер страницы (по умолчанию 1)
        - `page_size` (integer) — количество элементов на странице (по умолчанию 10, максимум 100)
        - `status` (string, опционально) — фильтр по статусу заявки:
          - `PENDING` — На проверке
          - `COMPLETED` — Выполнено
          - `REJECTED` — Отклонено
          - если не указан, возвращаются все заявки

        **Возвращаемые данные:**
        - `count` — общее количество заявок
        - `next` — URL следующей страницы (или null)
        - `previous` — URL предыдущей страницы (или null)
        - `total_pages` — общее количество страниц
        - `current_page` — текущая страница
        - `groups` — массив групп заявок по датам
          - `date` — название группы (например, "Сегодня", "Вчера", "15.03.2026")
          - `items` — массив заявок в этой группе

        **Структура заявки:**
        - `id` — идентификатор заявки
        - `user` — ID пользователя
        - `user_email` — email пользователя
        - `service` — ID услуги
        - `service_name` — название услуги
        - `bank` — ID банка
        - `bank_name` — название банка
        - `amount_from` — сумма к оплате
        - `currency_from` — валюта оплаты
        - `amount_to` — сумма зачисления
        - `currency_to` — валюта зачисления
        - `exchange_rate` — применённый курс
        - `recipient_account` — счёт получателя
        - `receipt_image` — URL чека об оплате
        - `status` — статус (PENDING, COMPLETED, REJECTED)
        - `manager_comment` — комментарий менеджера
        - `discount_percent` — процент скидки
        - `discount_amount` — сумма скидки
        - `final_amount` — итоговая сумма
        - `created_at` — дата создания
        - `updated_at` — дата обновления
        - `completed_at` — дата выполнения
      summary: История заявок
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Номер страницы
        examples:
          Страница1:
            value: 1
            summary: Страница 1
      - in: query
        name: page_size
        schema:
          type: integer
          default: 10
        description: Количество элементов на странице
        examples:
          10Элементов:
            value: 10
            summary: 10 элементов
      - in: query
        name: status
        schema:
          type: string
          enum:
          - COMPLETED
          - PENDING
          - REJECTED
        description: Фильтр по статусу заявки
        examples:
          НаПроверке:
            value: PENDING
            summary: На проверке
          Выполнено:
            value: COMPLETED
          Отклонено:
            value: REJECTED
      tags:
      - Orders
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      description: Список заявок с группировкой по датам
                      content:
                        application/json:
                          example:
                            count: 42
                            next: /api/v1/orders/history/?page=2
                            previous: null
                            total_pages: 5
                            current_page: 1
                            groups:
                            - date: Сегодня
                              items:
                              - id: 1
                                user_email: user@example.com
                                service_name: AliPay
                                bank_name: Optima
                                amount_from: '1000.00'
                                currency_from: KGS
                                amount_to: '119.40'
                                currency_to: CNY
                                exchange_rate: '0.1200'
                                status: COMPLETED
                                created_at: '2026-03-14T10:30:00Z'
                            - date: Вчера
                              items:
                              - id: 2
                                user_email: user@example.com
                                service_name: WeChat
                                bank_name: mBank
                                amount_from: '500.00'
                                status: PENDING
                                created_at: '2026-03-13T15:00:00Z'
                            - date: 10.03.2026
                              items: []
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Пользователь не авторизован
          description: ''
