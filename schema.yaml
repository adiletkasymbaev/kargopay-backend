components:
  schemas:
    Bank:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название банка
          maxLength: 100
        slug:
          type: string
          title: URL-слаг
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        logo:
          type: string
          format: uri
          nullable: true
          title: Логотип
        is_active:
          type: boolean
          title: Активен
      required:
      - id
      - name
      - slug
    CurrencyToEnum:
      enum:
      - KGS
      - RUB
      - USD
      - CNY
      type: string
      description: |-
        * `KGS` - KGS - Киргизский сом
        * `RUB` - RUB - Российский рубль
        * `USD` - USD - Доллар США
        * `CNY` - CNY - Китайский юань
    CustomRegister:
      type: object
      properties:
        username:
          type: string
          default: ''
        email:
          type: string
          format: email
        referral_code:
          type: string
        first_name:
          type: string
        last_name:
          type: string
      required:
      - email
      - first_name
      - last_name
    CustomRegisterRequest:
      type: object
      properties:
        username:
          type: string
          default: ''
        email:
          type: string
          format: email
          minLength: 1
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
        referral_code:
          type: string
        first_name:
          type: string
          minLength: 1
        last_name:
          type: string
          minLength: 1
      required:
      - email
      - first_name
      - last_name
    ExchangeRate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyToEnum'
          title: Валюта отдачи
        to_currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyToEnum'
          title: Валюта получения
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,4})?$
          title: Курс обмена
          description: Курс обмена валют
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Дата обновления
      required:
      - from_currency
      - id
      - rate
      - to_currency
      - updated_at
    Login:
      type: object
