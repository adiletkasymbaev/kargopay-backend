openapi: 3.0.3
info:
  title: KargoPay API
  version: 1.0.0
  description: Сервис пополнения AliPay
paths:
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      description: |-
        Получает все уведомления текущего пользователя с группировкой по датам.

        Уведомления возвращаются в хронологическом порядке (новые первыми) и группируются по датам:
        - **Сегодня** — уведомления за текущий день
        - **Вчера** — уведомления за вчерашний день
        - **N дн. назад** — уведомления за последние 7 дней
        - **ДД.ММ.ГГГГ** — более старые уведомления

        **Параметры запроса:**
        - `page` (integer) — номер страницы (по умолчанию 1)
        - `page_size` (integer) — количество элементов на странице (по умолчанию 10, максимум 100)

        **Возвращаемые данные:**
        - `count` — общее количество уведомлений
        - `next` — URL следующей страницы (или null)
        - `previous` — URL предыдущей страницы (или null)
        - `total_pages` — общее количество страниц
        - `current_page` — текущая страница
        - `groups` — массив групп уведомлений по датам
          - `date` — название группы (например, "Сегодня", "Вчера", "15.03.2026")
          - `items` — массив уведомлений в этой группе

        **Структура уведомления:**
        - `id` — идентификатор уведомления
        - `user` — ID пользователя
        - `title` — заголовок уведомления
        - `message` — текст уведомления
        - `notification_type` — тип уведомления (WELCOME, ORDER_STATUS, PROMOTION и т.д.)
        - `is_read` — статус прочтения
        - `is_sent` — статус отправки push-уведомления
        - `sent_at` — дата отправки push-уведомления
        - `created_at` — дата создания
        - `updated_at` — дата обновления
        - `related_object_id` — ID связанного объекта (например, заказа)
        - `related_object_type` — тип связанного объекта (например, "Order")
      summary: Список уведомлений
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Номер страницы
        examples:
          Страница1:
            value: 1
            summary: Страница 1
      - in: query
        name: page_size
        schema:
          type: integer
          default: 10
        description: Количество элементов на странице
        examples:
          10Элементов:
            value: 10
            summary: 10 элементов
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      description: Список уведомлений с группировкой по датам
                      content:
                        application/json:
                          example:
                            count: 25
                            next: /api/v1/notifications/?page=2
                            previous: null
                            total_pages: 3
                            current_page: 1
                            groups:
                            - date: Сегодня
                              items:
                              - id: 5
                                title: ✅ Заявка выполнена
                                message: 'Ваша заявка #123 выполнена. Средства зачислены
                                  на AliPay.'
                                notification_type: ORDER_COMPLETED
                                is_read: false
                                created_at: '2026-03-14T10:30:00Z'
                              - id: 4
                                title: "\U0001F389 Добро пожаловать!"
                                message: Спасибо за регистрацию в KargoPay
                                notification_type: WELCOME
                                is_read: true
                                created_at: '2026-03-14T09:00:00Z'
                            - date: Вчера
                              items:
                              - id: 3
                                title: "\U0001F4CD Заказ создан"
                                message: 'Ваша заявка #122 принята в обработку'
                                notification_type: ORDER_CREATED
                                is_read: true
                                created_at: '2026-03-13T15:00:00Z'
                            - date: 10.03.2026
                              items: []
              examples:
                ОтветСГруппировкойПоДатам:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 45
                      next: /api/v1/notifications/?page=3&page_size=20
                      previous: /api/v1/notifications/?page=1&page_size=20
                      total_pages: 3
                      current_page: 2
                      groups:
                      - date: Сегодня
                        items:
                        - id: 25
                          user: 1
                          title: "\U0001F389 Добро пожаловать!"
                          message: Спасибо за регистрацию в KargoPay
                          notification_type: WELCOME
                          is_read: true
                          is_sent: true
                          sent_at: '2026-03-14T10:00:00Z'
                          created_at: '2026-03-14T10:00:00Z'
                          updated_at: '2026-03-14T10:00:00Z'
                          related_object_id: null
                          related_object_type: null
                      - date: Вчера
                        items: []
                  summary: Ответ с группировкой по датам
                ПустойСписок:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - count: 0
                      next: null
                      previous: null
                      total_pages: 0
                      current_page: 1
                      groups: []
                  summary: Пустой список
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Пользователь не авторизован
          description: ''
  /api/v1/notifications/{notification_id}/read/:
    post:
      operationId: notifications_read_create
      description: "Отмечает конкретное уведомление как прочитанное.\n        \nИзменяет
        статус уведомления с \"непрочитанное\" на \"прочитанное\".\n\n**Параметры:**\n-
        `notification_id` (path) — идентификатор уведомления\n\n**Возвращаемые данные:**\n-
        `status` — статус операции ('success' или 'error')"
      summary: Отметить уведомление как прочитанное
      parameters:
      - in: path
        name: notification_id
        schema:
          type: integer
        description: Идентификатор уведомления
        required: true
        examples:
          IDУведомления:
            value: 123
            summary: ID уведомления
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Уведомление отмечено как прочитанное
                content:
                  application/json:
                    example:
                      status: success
              examples:
                УспешныйОтвет:
                  value:
                    status: success
                  summary: Успешный ответ
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Пользователь не авторизован
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Уведомление не найдено
              examples:
                УведомлениеНеНайдено:
                  value:
                    error: Уведомление не найдено
                  summary: Уведомление не найдено
          description: ''
  /api/v1/notifications/mark-all-read/:
    post:
      operationId: notifications_mark_all_read_create
      description: "Массово отмечает все непрочитанные уведомления пользователя как
        прочитанные.\n        \nПолезно при выходе из раздела уведомлений или при
        нажатии кнопки \"Прочитать все\".\n\n**Возвращаемые данные:**\n- `status`
        — статус операции ('success')"
      summary: Отметить все уведомления как прочитанные
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Все уведомления отмечены как прочитанные
                content:
                  application/json:
                    example:
                      status: success
              examples:
                УспешныйОтвет:
                  value:
                    status: success
                  summary: Успешный ответ
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Пользователь не авторизован
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: notifications_unread_count_retrieve
      description: "Возвращает количество непрочитанных уведомлений пользователя.\n
        \       \nПолезно для отображения бейджа на иконке уведомлений в приложении.\n\n**Возвращаемые
        данные:**\n- `unread_count` — количество непрочитанных уведомлений"
      summary: Количество непрочитанных уведомлений
      tags:
      - Notifications
      security:
      - jwtAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
              examples:
                УспешныйОтвет:
                  value:
                    unread_count: 5
                  summary: Успешный ответ
          description: ''
        '401':
          content:
            application/json:
              schema:
                description: Пользователь не авторизован
          description: ''
